[package]
name = "nds-agent-ci"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "nds-agent-ci"
path = "src/main.rs"

[dependencies]
flate2 = "=1.1.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tar = { version = "=0.4.46", default-features = false }
thiserror = "=2.0.21"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
