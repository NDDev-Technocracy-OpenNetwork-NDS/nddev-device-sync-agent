[workspace]
resolver = "3"
members = ["crates/io", "crates/agent", "crates/cli"]

[workspace.package]
version = "0.0.1-alpha.9"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent"

# Provider libraries and the CLI share this workspace-owned I/O implementation.
[patch."https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent"]
nddev-device-sync-adapter-io = { path = "crates/io" }
