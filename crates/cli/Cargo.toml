[package]
name = "nds-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
nddev-device-sync-github = { version = "=0.0.1-alpha.7", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-github", rev = "b37737e7d6fbd98380c8aadbe86bf875998be7e1", features = ["catalog-runtime", "commit-sync"] }
nddev-device-sync-domain = { version = "=0.0.12", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "ad614122d5916accbe1cca198768968b8c5bad0e" }
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", path = "../io" }
nddev-device-sync-accounts = { version = "=0.0.1-alpha.24", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "1e65cfb2e03459f3ae4cab92f6a036dd53e2f77c" }
nddev-device-sync-vault = { version = "=0.0.1-alpha.12", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault", rev = "bb7f1b1bac8bbd8a8d3e9a6f42b2c41fb8e2ab45" }
serde_json = "1"
tracing = "0.1"
nddev-device-sync-telemetry = { version = "=0.0.1-alpha.11", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "c942a9ec95b11824d86e9842d2c0e3be340f3728", features = ["client-traces"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "signal", "io-std", "io-util"] }
zeroize = "1.8"
uuid = { version = "1.27", features = ["v4"] }

[features]
development-http = ["nddev-device-sync-accounts/development-http", "nddev-device-sync-vault/development-http"]

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
