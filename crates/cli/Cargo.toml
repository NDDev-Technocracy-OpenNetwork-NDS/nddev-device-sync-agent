[package]
name = "nds-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
nddev-device-sync-domain = { version = "=0.0.12", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "63caf93c1e431c4cbc74414f797ab836083db23e" }
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", path = "../io" }
nddev-device-sync-accounts = { version = "=0.0.1-alpha.24", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "6aebbf2e1826fc2de5d3883549af6a53d232951f" }
nddev-device-sync-vault = { version = "=0.0.1-alpha.11", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault", rev = "f022c2e900936091eabd9bb2d766ef01cb52caf7" }
serde_json = "1"
tracing = "0.1"
nddev-device-sync-telemetry = { version = "=0.0.1-alpha.11", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "32f21f8a8f9c313bee9dcd1769c042133b5520da", features = ["client-traces"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.8"

[features]
development-http = ["nddev-device-sync-accounts/development-http", "nddev-device-sync-vault/development-http"]

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
