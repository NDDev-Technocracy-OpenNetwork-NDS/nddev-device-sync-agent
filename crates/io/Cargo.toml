[package]
name = "nddev-device-sync-adapter-io"
version = "0.0.1-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
zeroize = "1.8"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "creation-flags", "kill-on-drop"] }
socket2 = "0.6.5"
serde = "1"
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.15.0"
errno = "0.3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
