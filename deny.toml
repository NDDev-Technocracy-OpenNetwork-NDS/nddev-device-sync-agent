[advisories]
yanked = "deny"

[licenses]
allow = ["AGPL-3.0-only", "Apache-2.0", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.95

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-protocol.git",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-cleaner",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-clipboard",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-gds",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-rds",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-sysinfo",
    "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-updater",
]

# Native libsecret build-time target detection; reviewed permissive exception.
[[licenses.exceptions]]
name = "target-lexicon"
version = "=0.13.5"
allow = ["Apache-2.0 WITH LLVM-exception"]
