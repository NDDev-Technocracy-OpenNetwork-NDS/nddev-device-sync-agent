name: main-ci

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contract:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared native SDK
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@e3698840cdcfc74e2808889b8a03bbcb20bd6d38 # v0.6.54
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
      - name: Restore the native dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Prepare exact native quality tools
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@e3698840cdcfc74e2808889b8a03bbcb20bd6d38 # v0.6.54
        with:
          manifest: .github/native-tools.json
          directory: ${{ runner.temp }}/agent-native-tools
          add-to-path: true
      - name: Prepare locked source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@e3698840cdcfc74e2808889b8a03bbcb20bd6d38 # v0.6.54
        with:
          recipe: setup
      - name: Verify the complete native contract and release libraries
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@e3698840cdcfc74e2808889b8a03bbcb20bd6d38 # v0.6.54
        with:
          recipe: verify
      - name: Retain the actual native test report
        if: ${{ !cancelled() && hashFiles('.nddev-reports/nextest/ci/junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-tests-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .nddev-reports/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 3

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2022]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared native SDK
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@e3698840cdcfc74e2808889b8a03bbcb20bd6d38 # v0.6.54
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
          python-version: ${{ runner.os == 'Linux' && '3.15.2' || '' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Native transport tests
        run: cargo test --locked --workspace
      - name: Prepare the pinned real native provider
        if: runner.os == 'Linux'
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@e3698840cdcfc74e2808889b8a03bbcb20bd6d38 # v0.6.54
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          recipe: provider-prepare
          arguments: '["${{ runner.temp }}/native-provider"]'
      - name: Real assembled agent acceptance
        if: runner.os == 'Linux'
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@e3698840cdcfc74e2808889b8a03bbcb20bd6d38 # v0.6.54
        with:
          recipe: provider-check
