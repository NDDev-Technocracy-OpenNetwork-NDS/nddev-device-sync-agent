name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Install pinned quality tools
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@365415f32190ae22ff22462e791a4829ad6e91fc # nddev-cicd-v0.6.16
        with:
          # cargo-audit 0.22.2, cargo-deny 0.20.2 and cargo-nextest 0.9.149 from checksummed
          # releases instead of compiling them with cargo install in every job.
          capability: rust
      - name: Run the STD-0004 native Rust contract
        id: native
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@a77e385fcf3c1b000c38167ecac7b74bb7715b10 # std-0004-v0.3.1
      - name: Require complete native results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.native.outputs.status }}
        run: test "$STATUS" = success
      - name: Run the RustSec advisory audit
        run: cargo audit --deny warnings

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Native transport tests
        run: cargo test --locked --workspace
      - name: Fetch the canonical native test providers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/nds-metadata.json"
          python3 - "$RUNNER_TEMP/nds-metadata.json" "$RUNNER_TEMP/native-provider" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          packages = json.loads(Path(sys.argv[1]).read_text())["packages"]
          for name in ["sysinfo"]:
              provider = next(p for p in packages if p["name"] == "nddev-device-sync-" + name)
              lock = Path(provider["manifest_path"]).parent / "provider.lock.json"
              destination = Path(sys.argv[2]) / name
              subprocess.run([sys.executable, "scripts/fetch-provider.py", str(lock), str(destination)], check=True)
          PY
      - name: Real assembled agent acceptance
        if: runner.os == 'Linux'
        run: python3 scripts/check-agent.py
