name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared native SDK
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
      - name: Restore the native dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Prepare exact native quality tools
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          manifest: .github/native-tools.json
          directory: ${{ runner.temp }}/agent-native-tools
          add-to-path: true
      - name: Prepare locked source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: setup
      - name: Check source without compilation
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: check
      - name: Run the complete native and tooling tests
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: test
      - name: Retain the actual native test report
        if: ${{ !cancelled() && hashFiles('.nddev-reports/nextest/ci/junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-tests-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .nddev-reports/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 3
