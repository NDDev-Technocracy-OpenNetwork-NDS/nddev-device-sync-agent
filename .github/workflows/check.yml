name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the declared native SDK
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@d89f22a1b66410466de98dead910d47cf4450c6a
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
      - name: Restore the native dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Prepare exact native quality tools
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@d89f22a1b66410466de98dead910d47cf4450c6a
        with:
          manifest: .github/native-tools.json
          directory: ${{ runner.temp }}/agent-native-tools
          add-to-path: true
      - name: Prepare locked source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@d89f22a1b66410466de98dead910d47cf4450c6a
        with:
          recipe: setup
      - name: Check source without compilation
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@d89f22a1b66410466de98dead910d47cf4450c6a
        with:
          recipe: check
      - name: Run the complete native and tooling tests
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@d89f22a1b66410466de98dead910d47cf4450c6a
        with:
          recipe: test
